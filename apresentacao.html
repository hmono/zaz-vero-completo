const chapters = content.chapters;
const assets = Object.fromEntries(manifest.items.map(item => [item.id, item]));
const aliases = {vitrine:'vitrine-gallery',zarah:'zarah-app'};
if (assets['logo-white']?.path) $('.brand img').src = `public/${assets['logo-white'].path}`;
let current = 0, pinned = null, hovered = null;

const app = $('#app'), nav = $('#nav-list');
const number = (value, digits=1) => new Intl.NumberFormat('pt-BR',{maximumFractionDigits:digits,minimumFractionDigits:digits}).format(value);
const month = value => {const [year,m] = value.split('-'); return `${['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][Number(m)-1]}/${year}`;};
const metrics = [
 {key:'accreditations',name:'Credenciamentos',format:v=>number(v,0)},
 {key:'fte',name:'Equipe (FTE)',format:v=>number(v,2)},
 {key:'accreditationsPerFte',name:'Credenciamentos / FTE',format:v=>number(v,2)},

 {key:'tpvMeanBRL',name:'TPV médio por transacionante',format:v=>`R$ ${number(v,2)}`}
];
function asset(key) { return assets[aliases[key] || key]; }
function assetMarkup(key) {const a=asset(key); if (!a || a.status !== 'ready') { const flow = key === 'crm' ? 'Oportunidade → acompanhamento comercial → próxima ação' : key === 'zarah-whatsapp' ? 'Cliente entra em contato → assunto identificado → atendimento humano' : ''; return `<div class="pending">${flow ? `<strong>Fluxo conceitual</strong><p>${esc(flow)}</p>` : '<strong>Captura indisponível</strong>'}<p>${esc(a?.caption || 'Captura própria ainda não disponível.')}</p></div>`; } const path=`public/${esc(a.path)}`; return a.kind === 'video' ? `<video controls preload="metadata" playsinline muted ${a.poster ? `poster="public/${esc(a.poster)}"` : ''}><source src="${path}" type="video/mp4">Seu navegador não suporta vídeo.</video>` : `<button class="zoom-trigger" aria-label="Ampliar imagem: ${esc(a.title || key)}"><img src="${path}" alt="${esc(key === 'vitrine-history' ? 'Controles de decisão e acesso ao histórico na Vitrine' : a.title || key)}"><span>Ampliar imagem ↗</span></button>`; }
function frame(ch, body, cls='') {return `<article class="page ${cls}"><div class="eyebrow">${esc(ch.eyebrow)} · ${ch.minutes} MIN</div><h1>${esc(ch.title)}</h1><p class="lead">${esc(ch.lead)}</p>${body}</article>`;}
function mediaPanel(ch, index=0) { const item=ch.items[index], a=asset(item.key); return `<div class="media-copy"><h2>${esc(item.name)}</h2><p>${esc(item.description)}</p><p class="caption">${esc(item.pending || item.caption || a?.caption || 'Registro real da operação.')}</p></div><div class="media-frame">${assetMarkup(item.key)}</div>`; }
function chart(metric) {
 const rows=history.rows, vals=rows.map(r=>r[metric.key]).filter(v=>v !== null && Number.isFinite(v));
 const max=Math.max(...vals,1), min=Math.min(0,...vals), x=i=>15+i*570/(rows.length-1), y=v=>130-(v-min)/(max-min || 1)*115;
 let paths=[], part=[]; rows.forEach((r,i)=>{const v=r[metric.key];if(v===null||!Number.isFinite(v)){if(part.length)paths.push(part.join(' '));part=[];}else part.push(`${part.length?'L':'M'} ${x(i).toFixed(1)} ${y(v).toFixed(1)}`)}); if(part.length)paths.push(part.join(' '));
 const points=rows.map((r,i)=>`<rect class="hit" x="${x(i)-6.4}" y="0" width="12.8" height="140" tabindex="0" role="button" aria-label="${esc(month(r.month))}: ${r[metric.key] == null ? 'sem dados' : esc(metric.format(r[metric.key]))}" data-index="${i}"></rect>`).join('');
 const missing=['marginPercent','tpvMeanBRL'].includes(metric.key), start=rows.findIndex(r=>r.month==='2026-04'), bandStart=(x(start-1)+x(start))/2;
 const annual=['2023-01','2024-01','2025-01','2026-01'].map(m=>{const i=rows.findIndex(r=>r.month===m);return `<span style="left:${x(i)/6}%">${m.slice(0,4)}</span>`}).join('');
 return `<section class="chart" data-metric="${metric.key}" data-min="${min}" data-max="${max}"><h3>${metric.name}<span class="scale-label">Escala: ${metric.format(min)} a ${metric.format(max)}</span>${missing?'<span class="missing-label">Sem dados · abr–ago/26</span>':''}</h3><svg viewBox="0 0 600 150" preserveAspectRatio="none" role="group" aria-label="${metric.name}, série mensal">${missing?`<rect class="missing-band" x="${bandStart}" y="5" width="${590-bandStart}" height="125"/>`:''}<line class="guide" x1="15" y1="130" x2="585" y2="130"/>${paths.map(d=>`<path class="line" d="${d}"/>`).join('')}<line class="selected" visibility="hidden" x1="0" y1="5" x2="0" y2="130"/><circle class="selected-point" visibility="hidden" cx="0" cy="0" r="4.5"/>${points}</svg><div class="chart-axis">${annual}<span class="axis-end">ago/26</span></div><p class="chart-result"></p></section>`;
}

function selectMonth(index, pin=false) {
 if(pin){pinned=pinned===index?null:index;hovered=null;}else hovered=index;
 const selected=hovered ?? pinned ?? defaultMonth;
 document.querySelectorAll('.chart').forEach(el=>{
  const metric=metrics.find(m=>m.key===el.dataset.metric), row=history.rows[selected], line=$('.selected',el), point=$('.selected-point',el), output=$('.chart-result',el);
  if(!row){line.setAttribute('visibility','hidden');point.setAttribute('visibility','hidden');output.textContent='';return;}
  const x=15+selected*570/(history.rows.length-1), v=row[metric.key], min=Number(el.dataset.min), max=Number(el.dataset.max);
  line.setAttribute('visibility','visible');line.setAttribute('x1',x);line.setAttribute('x2',x);
  if(v == null || !Number.isFinite(v)){point.setAttribute('visibility','hidden');} else {point.setAttribute('visibility','visible');point.setAttribute('cx',x);point.setAttribute('cy',130-(v-min)/(max-min||1)*115);}
  output.innerHTML=`<strong>${month(row.month)}</strong> · ${v == null ? 'Sem dados' : metric.format(v)}${pinned===selected?' · fixado':''}`;
 });
}
let lastZoomTrigger = null;
function closeZoom(){const dialog=$('#image-dialog');if(dialog?.open){dialog.close();lastZoomTrigger?.focus();}}
document.addEventListener('click',e=>{const trigger=e.target.closest('.zoom-trigger');if(!trigger)return;lastZoomTrigger=trigger;const dialog=$('#image-dialog');const original=$('img',trigger);$('img',dialog).src=original.src;$('img',dialog).alt=original.alt;dialog.showModal();});
$('#image-dialog').addEventListener('cancel',e=>{e.preventDefault();closeZoom();});
$('#close-image').addEventListener('click',closeZoom);
function bind(ch){document.querySelectorAll('[data-media]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('video').forEach(v=>v.pause());document.querySelectorAll('[data-media]').forEach(x=>x.setAttribute('aria-selected',x===b));$('#media-panel').innerHTML=mediaPanel(ch,Number(b.dataset.media));}));document.querySelectorAll('[data-plan]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-plan]').forEach(x=>x.setAttribute('aria-selected',x===b));$('#plan-frame').innerHTML=assetMarkup(b.dataset.plan);}));document.querySelectorAll('[data-scenario]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-scenario]').forEach(x=>x.setAttribute('aria-pressed',x===b));const isSecond=b.dataset.scenario==='1';$('#scenario-value').textContent=isSecond?'107,5%':'82,5%';$('#scenario-detail').textContent=isSecond?'5 Alfa, 4 Beta e 1 Charlie · média ponderada · +25 pontos percentuais':'3 Alfa, 4 Beta e 3 Charlie · média ponderada';}));document.querySelectorAll('.hit').forEach(p=>{let i=Number(p.dataset.index);p.addEventListener('mouseenter',()=>selectMonth(i));p.addEventListener('focus',()=>selectMonth(i));p.addEventListener('click',()=>selectMonth(i,true));p.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectMonth(i,true);}});});document.querySelectorAll('.chart svg').forEach(svg=>svg.addEventListener('mouseleave',()=>{hovered=null;selectMonth(null);})); if(ch.type==='charts')selectMonth(null);}
function navigate(i){if(i<0||i>=chapters.length)return; document.querySelectorAll('video').forEach(v=>v.pause()); location.hash=chapters[i].id;}
$('.skip').addEventListener('click',e=>{e.preventDefault();$('#main').focus();});
window.addEventListener('hashchange',()=>{const i=chapters.findIndex(c=>c.id===location.hash.slice(1));if(i<0)return;current=i;document.querySelectorAll('video').forEach(v=>v.pause());$('#chapters').classList.remove('open');$('#menu-toggle').setAttribute('aria-expanded','false');render();});
$('#prev').addEventListener('click',()=>navigate(current-1));$('#next').addEventListener('click',()=>navigate(current+1));$('#menu-toggle').addEventListener('click',()=>{const open=$('#chapters').classList.toggle('open');$('#menu-toggle').setAttribute('aria-expanded',open);});document.addEventListener('keydown',e=>{if(e.target.getAttribute('role')==='tab' && (e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();const tabs=[...e.target.parentElement.querySelectorAll('[role=tab]')];const step=e.key==='ArrowRight'?1:-1;const next=tabs[(tabs.indexOf(e.target)+step+tabs.length)%tabs.length];next.focus();next.click();return;}if(e.defaultPrevented||e.altKey||e.ctrlKey||e.metaKey||/INPUT|TEXTAREA|SELECT|VIDEO|BUTTON/.test(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();navigate(current+1);}if(e.key==='ArrowLeft'){e.preventDefault();navigate(current-1);}});current=Math.max(0,chapters.findIndex(c=>c.id===location.hash.slice(1)));render();</script></body></html>
